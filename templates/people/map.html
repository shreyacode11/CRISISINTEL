{% extends "base.html" %}
{% block title %}Safe Route{% endblock %}
{% block content %}

    {{ map_html | safe }}
</div>

<div class="mt-3">
    <a href="{{ url_for('people_request') }}" class="btn btn-outline-secondary"><i class="fa fa-arrow-left me-2"></i>Back</a>
</div>
{% endblock %}
